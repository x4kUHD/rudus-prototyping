<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RUDUS Onboarding</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #444;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
    }

    .eyebrow {
      color: #888;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 0.85rem;
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .subtext {
      color: #aaa;
      margin-bottom: 3rem;
      font-size: 1.1rem;
    }

    .cards-container {
      display: flex;
      gap: 1.5rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .card {
      background-color: #555;
      border: 1px solid #666;
      border-radius: 4px;
      padding: 2rem;
      width: 280px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: left;
    }

    .card:hover {
      background-color: #666;
      border-color: #888;
    }

    .card:active {
      transform: scale(0.98);
    }

    .icon-placeholder {
      background-color: #666;
      height: 80px;
      border-radius: 4px;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-placeholder i {
      font-size: 32px;
      color: #aaa;
    }

    .card h2 {
      font-size: 1.25rem;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: #aaa;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .link-new {
      color: #777;
      text-decoration: none;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .link-new:hover {
      text-decoration: underline;
    }
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script>
    function selectPlatform(platform) {
      if (platform === 'etakeoff') {
        window.location.href = 'index.html';
      } else if (platform === 'ost') {
        window.location.href = 'index2.html';
      }
    }
  </script>
</head>

<body>
  <div class="eyebrow">RUDUS</div>
  <h1>Which platform are you coming from?</h1>
  <div class="subtext">We'll set up your workspace to match what you already know.</div>

  <div class="cards-container">
    <!-- Card 1 — eTakeoff Dimension -->
    <div class="card" onclick="selectPlatform('etakeoff')">
      <div class="icon-placeholder">
        <i class="ti ti-layout-navbar"></i>
      </div>
      <h2>eTakeoff Dimension</h2>
      <p>Ribbon toolbar &middot; Trace tree &middot; Floating panels</p>
    </div>

    <!-- Card 2 — On-Screen Takeoff -->
    <div class="card" onclick="selectPlatform('ost')">
      <div class="icon-placeholder">
        <i class="ti ti-layout-sidebar"></i>
      </div>
      <h2>On-Screen Takeoff</h2>
      <p>Split panel &middot; Layer-based &middot; Full plan view</p>
    </div>
  </div>

  <div class="link-new" onclick="selectPlatform('etakeoff')">I'm new to takeoff software &rarr;</div>
</body>

</html>
